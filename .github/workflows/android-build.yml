name: DCT Android Source Build

on:
  push:
    branches:
      - ui-redesign-source
    paths:
      - 'source/dct/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK from source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Show build environment
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        working-directory: source/dct
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DCT-ui-redesign-debug-apk
          path: source/dct/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
